[package]
name = "piropipo"
version = "0.5.1"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "piro"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ffmml = "0.1.2"
hound = "3.5.1"
png = "0.18.1"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sfxr = "0.1.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
